[package]
name = "master-program"
version = "0.1.0"
edition = "2024"

# Binary name is underscore (master_program) so the levelup autostart finds it at
# master-program/target/{debug,release}/master_program. Package/folder stay hyphenated.
[[bin]]
name = "master_program"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
async-stream = "0.3"
